services:
  - type: web
    name: caprae-lead-intelligence
    runtime: python
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 22.16.0
      - key: SERVE_FRONTEND
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./leads.db
      - key: VITE_API_URL
        value: ""
